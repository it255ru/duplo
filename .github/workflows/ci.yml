# CI for duplo. Action versions are major tags; Dependabot keeps them
# current. For stricter supply-chain control pin them to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: safety invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Destructive calls only in verified code paths
        run: python tools/check_invariants.py main.py

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python -m pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: pytest ${{ matrix.os }} py${{ matrix.python }}
    needs: invariants
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Tests
        run: python -m pytest
      - name: CLI smoke test (non-UTF-8 output, exit codes)
        shell: bash
        env:
          PYTHONIOENCODING: cp1252
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/smoke"
          mkdir -p "$tree/A" "$tree/B"
          printf 'duplicate' > "$tree/A/фото.jpg"
          cp "$tree/A/фото.jpg" "$tree/B/фото.jpg"
          python main.py "$tree" --no-cache > "$RUNNER_TEMP/report.txt"
          set +e
          python main.py "$tree/absent" --no-cache
          code=$?
          set -e
          test "$code" -eq 2
          echo n | python main.py "$tree" --no-cache --auto-first
          test -f "$tree/B/фото.jpg"
